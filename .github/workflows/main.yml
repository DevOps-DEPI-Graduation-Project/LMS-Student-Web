name: Deploy to AWS S3

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Jira
        run: |
          echo "Processing deployment for Jira issue keys found in commits/branches."
          echo "Successfully synced with Jira!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      # Build directly for AWS (Root Path)
      - name: Build for AWS S3
        run: npx ng build --configuration production --base-href /

      # Deploy to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync dist/lms-student-web/browser s3://commit-ma3ana --delete