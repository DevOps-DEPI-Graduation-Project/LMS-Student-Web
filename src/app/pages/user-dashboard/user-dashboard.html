<div class="min-h-screen bg-[var(--background)] p-4 md:p-10 transition-colors duration-300">
  <div class="max-w-7xl mx-auto space-y-16">
    <section>
      <div
        class="bg-surface rounded-[32px] p-8 md:p-12 flex flex-col lg:flex-row justify-between items-center relative overflow-hidden shadow-sm border border-[var(--outline)]/50"
      >
        <div class="z-10 text-center lg:text-left">
          <h1 class="font-display text-[var(--text-primary)] mb-4 leading-tight">
            Ready to study today?
          </h1>
          <p class="font-body text-[var(--text-secondary)] mb-8 opacity-90">
            Continue your journey to mastery.
          </p>
          <button
            (click)="latestCourse && onCourseClick(latestCourse.slug)"
            class="bg-[var(--primary)] text-[var(--on-primary)] px-10 py-4 rounded-2xl fw-bold hover:bg-[var(--primary-hover)] transition-all shadow-lg shadow-teal-900/10 active:scale-95"
          >
            Resume Last Lesson
          </button>
        </div>
        <img
          src="/images/home-after-login.jpeg"
          class="w-64 hidden lg:block animate-float"
          alt="hero"
        />
      </div>
    </section>

    <section class="pb-10">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-[var(--text-primary)] font-title">My Courses</h2>
        <a
          (click)="goToMyCourses()"
          class="text-[var(--primary)] font-bold hover:underline cursor-pointer font-caption uppercase tracking-wider"
        >
          View All →
        </a>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        @for (course of dashboardCourses; track course.slug) {
          <div
            class="h-full hover:-translate-y-2 transition-transform duration-300 cursor-pointer"
            (click)="onCourseClick(course.slug)"
          >
            <app-user-course-card [course]="course"></app-user-course-card>
          </div>
        } @empty {
          <app-skeleton [type]="'courses-grid'" [count]="3"></app-skeleton>

        }
      </div>
    </section>
    <section>
      <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-4">
        <div>
          <h2 class="text-[var(--text-primary)] font-title mb-3">Top Rated</h2>
          <p class="font-body text-[var(--text-secondary)] opacity-80">
            Our most popular paths for future developers
          </p>

        </div>
         <a
          (click)="goToExplore()"
          class="text-[var(--primary)] font-bold hover:underline cursor-pointer font-caption uppercase tracking-wider"
        >
          explore more courses →
        </a>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
        @for (course of topRatedCourses; track course.slug) {
          <div
            class="h-full hover:-translate-y-2 transition-transform duration-300 cursor-pointer"
            (click)="onCourseClick(course.slug)"
          >
            <app-card [course]="course"></app-card>
          </div>
        } @empty {
          <app-skeleton [type]="'courses-grid'" [count]="3"></app-skeleton>

        }
      </div>
    </section>
  </div>
</div>
